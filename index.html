<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: Arial, sans-serif;
    }
    model-viewer {
      width: 100vw; height: 100vh;
      background-color: #000000;
    }

    #brand-title {
      position: absolute;
      top: 16px;
      left: 16px;
      color: #ffffff;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: rgba(15, 15, 15, 0.7);
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #333;
      pointer-events: none;
      z-index: 10;
    }

    #ar-button {
      background-color: #ffffff;
      border-radius: 4px;
      border: none;
      position: absolute;
      top: 16px;
      right: 16px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #000000;
      cursor: pointer;
      z-index: 10;
    }

    #controls-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      background: rgba(15, 15, 15, 0.85);
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #333333;
      z-index: 10;
      width: 90vw;
      max-width: 650px;
      scrollbar-width: none; 
    }
    #controls-panel::-webkit-scrollbar { display: none; }

    .btn-control {
      background: #222222;
      color: #ffffff;
      border: 1px solid #444444;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .btn-control:hover { background: #333333; }
    .btn-control.active { border-color: #007bff; background: #112233; }
    .separator { width: 1px; background: #444; margin: 0 4px; }

    @media (max-width: 600px) {
      #brand-title { font-size: 9px; padding: 6px 8px; left: 10px; }
      #ar-button { font-size: 10px; padding: 6px 10px; right: 10px; }
      #controls-panel { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 8px; bottom: 16px; }
      .btn-control { flex-shrink: 0; padding: 8px 12px; }
      .separator { flex-shrink: 0; }
    }
  </style>
</head>
<body>

  <!-- Incluye v2.0 para confirmar que cargó el nuevo código -->
  <div id="brand-title">Muestra Anatómica 3D (v2.0)</div>

  <model-viewer 
    id="craneo-viewer"
    src="Tutuma2-P3-COMP.glb" 
    style="background-color: #000000;"
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    tone-mapping="neutral" 
    shadow-intensity="2.0"
    shadow-softness="0.1"
    exposure="1.2"
    min-camera-orbit="auto auto 30%"  
    max-camera-orbit="auto auto 200%" 
    camera-orbit="0deg 75deg 105%">
    
    <button slot="ar-button" id="ar-button">
      Ver en Realidad Aumentada
    </button>
  </model-viewer>

  <div id="controls-panel">
    <button class="btn-control" onclick="cambiarVista('0deg 75deg 105%')">Posterior</button>
    <button class="btn-control" onclick="cambiarVista('0deg 0deg 105%')">Superior</button>
    <button class="btn-control" onclick="cambiarVista('90deg 75deg 105%')">Lateral</button>
    <button class="btn-control" onclick="cambiarVista('180deg 75deg 105%')">Frontal</button>

    <div class="separator"></div>

    <button class="btn-control" onclick="cambiarModoLuz('estudio')">Focos Estudio</button>
    <button class="btn-control" onclick="cambiarModoLuz('alto-contraste')">Alto Contraste</button>
    <button class="btn-control" onclick="cambiarModoLuz('rasante')">Luz Rasante</button>

    <div class="separator"></div>

    <button class="btn-control" id="btn-rotation" onclick="toggleRotacion()">Auto-Giro</button>
    <button class="btn-control" onclick="toggleFullscreen()">Pantalla Completa</button>
  </div>

  <script>
    const mv = document.querySelector("#craneo-viewer");

    mv.addEventListener('load', () => {
      if (mv.model && mv.model.materials && mv.model.materials[0]) {
        mv.model.materials[0].pbrMetallicRoughness.setRoughnessFactor(0.70);
        mv.model.materials[0].pbrMetallicRoughness.setMetalnessFactor(0.0);
      }
    });

    function cambiarVista(orbit) { mv.cameraOrbit = orbit; }

    function cambiarModoLuz(modo) {
      if (modo === 'estudio') {
        mv.exposure = 1.3;
        mv.toneMapping = 'neutral';
        mv.shadowIntensity = 1.8;
        mv.shadowSoftness = 0.2;
      } else if (modo === 'alto-contraste') {
        mv.exposure = 1.6;
        mv.toneMapping = 'commerce';
        mv.shadowIntensity = 2.5;
        mv.shadowSoftness = 0.0;
      } else if (modo === 'rasante') {
        mv.exposure = 0.8;
        mv.toneMapping = 'aces';
        mv.shadowIntensity = 3.0;
        mv.shadowSoftness = 0.1;
      }
    }

    function toggleRotacion() {
      mv.autoRotate = !mv.autoRotate;
      document.getElementById('btn-rotation').classList.toggle('active', mv.autoRotate);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) { document.exitFullscreen(); }
      }
    }
  </script>

</body>
</html>
