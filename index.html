<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: #000000;
    }
    model-viewer {
      width: 100vw; height: 100vh;
      background-color: #000000;
    }
  </style>
</head>
<body>

  <model-viewer 
    id="craneo-shiny"
    src="Tutuma2-P3-COMP.glb" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    tone-mapping="neutral" 
    shadow-intensity="1"
    exposure="1.5"> <!-- Subimos exposición para ver más brillos -->
  </model-viewer>

  <script>
    const mv = document.querySelector("#craneo-shiny");
    
    // Esperamos a que cargue el modelo
    mv.addEventListener('load', () => {
      // 1. Obtenemos el material
      const material = mv.model.materials[0];

      // 2. Quitamos el tono mate (Bajamos Roughness)
      // Un valor de 0 es un espejo, 1 es papel mate.
      // 0.2 es un brillo pulido muy bueno.
      material.pbrMetallicRoughness.setRoughnessFactor(0.2);

      // 3. (Opcional) Aumentamos el tono metálico para más reflejos
      // Un valor bajo (0.1 o 0.2) lo mantiene orgánico pero brillante.
      material.pbrMetallicRoughness.setMetalnessFactor(0.1);

      console.log("Material actualizado a brillante");
    });
  </script>

</body>
</html>
